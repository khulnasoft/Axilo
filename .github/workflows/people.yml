name: Axilo People

on:
  schedule:
    - cron: "0 14 1 * *" # Run at 14:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: "false"
      dry_run:
        description: "Run in dry-run mode (no changes will be made)"
        required: false
        default: "false"

# Environment variables available to all jobs and steps in this workflow
env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: ghcr.io/khulnasoft/axilo-people:latest

jobs:
  axilo-people:
    name: Generate People Data
    # Only run for the khulnasoft repository
    if: github.repository_owner == 'khulnasoft'
    runs-on: ubuntu-latest
    container:
      image: ${{ env.DOCKER_IMAGE }}
      options: --cpus 2 --memory 2g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper version calculation

      # Setup Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Run tests
      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lint code
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --max-complexity=10 --max-line-length=127 --statistics

      # Debug info
      - name: Dump environment info
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python --version
          pip list

      # Debug with tmate if enabled
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      # Run the main action
      - name: Generate People Data
        uses: ./.github/actions/people
        with:
          token: ${{ secrets.AXILO_PEOPLE }}
          dry_run: ${{ github.event.inputs.dry_run || 'false' }}

      # Upload coverage report
      - name: Upload coverage to Codecov
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.debug_enabled != 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  # Add a job to notify on failure
  notify-failure:
    name: Notify on Failure
    needs: axilo-people
    if: ${{ failure() && needs.axilo-people.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_TITLE: "Workflow failed: ${{ github.workflow }}"
          SLACK_MESSAGE: "${{ github.workflow }} failed on ${{ github.ref }} (Commit: ${{ github.sha }})"
          SLACK_FOOTER: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
