# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` in the `root` directory
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
    # Assign PRs to the person or team who owns the repository
    assignees:
      - "@neopilotai/team"
    # Group updates for similar dependencies together
    groups:
      dependencies:
        patterns:
          - "*"
    # Apply labels to all dependency updates
    labels:
      - "dependencies"
      - "javascript"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Look for `.github/workflows` containing GitHub Actions
    directory: "/.github/workflows"
    # Check for updates once a day
    schedule:
      interval: "daily"
    # Assign PRs to the person or team who owns the repository
    assignees:
      - "@neopilotai/team"
    # Apply labels to all GitHub Actions updates
    labels:
      - "github-actions"
      - "dependencies"
